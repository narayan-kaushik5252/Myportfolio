<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Narayan | Certificates</title>
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
    <link rel="stylesheet" href="style2.css">
    <link rel="shortcut icon" href="assets/S favicon.ico" type="image/x-icon">
</head>

<body>
    <div class="container">
        <section class="section" id="projects">
            <div class="top-header">
                <h1>My Certificates</h1>
            </div>

            <!-- ===== Internships ===== -->
            <div class="skill-headline" id="internships">Internships</div>
            <div class="project-container">

                <div class="project-box">
                    <img src="assets/zidio-internship-offer-letter.jpeg" class="portrait"
                        alt="Zidio Development internship offer letter - Java Full Stack Developer Intern">
                    <div class="certificate-name">
                        <span>Zidio Development</span>
                        <small>Offer Letter &middot; Java Full Stack Intern</small>
                    </div>
                    <label>
                        <a href="assets/zidio-internship-offer-letter.jpeg" class="view-link" title="View"
                            target="_blank" rel="noopener"> <i class="uil uil-eye"></i></a>
                    </label>
                </div>

                <div class="project-box">
                    <img src="assets/codealpha-java-internship.jpeg"
                        alt="CodeAlpha Java Programming internship certificate">
                    <div class="certificate-name">
                        <span>CodeAlpha</span>
                        <small>Java Programming Internship</small>
                    </div>
                    <label>
                        <a href="assets/codealpha-java-internship.jpeg" class="view-link" title="View" target="_blank"
                            rel="noopener"> <i class="uil uil-eye"></i></a>
                    </label>
                </div>

            </div>

            <!-- ===== Courses ===== -->
            <div class="skill-headline" id="courses">Courses &amp; Learning</div>
            <div class="project-container">

                <div class="project-box">
                    <img src="assets/advanced-python-programming.jpeg"
                        alt="Galgotias College Advance Python Programming value added course certificate">
                    <div class="certificate-name">
                        <span>Galgotias College</span>
                        <small>Advance Python Programming</small>
                    </div>
                    <label>
                        <a href="assets/advanced-python-programming.jpeg" class="view-link" title="View"
                            target="_blank" rel="noopener"> <i class="uil uil-eye"></i></a>
                    </label>
                </div>

                <div class="project-box">
                    <img src="assets/simplilearn-web-development.jpeg"
                        alt="Simplilearn SkillUP Web Development for Beginners certificate of completion">
                    <div class="certificate-name">
                        <span>Simplilearn</span>
                        <small>Web Development for Beginners</small>
                    </div>
                    <label>
                        <a href="assets/simplilearn-web-development.jpeg" class="view-link" title="View"
                            target="_blank" rel="noopener"> <i class="uil uil-eye"></i></a>
                    </label>
                </div>

            </div>
        </section>
    </div>
    <!-- scroll reveal link  -->
    <script src="https://unpkg.com/scrollreveal"></script>
    <script>
        const sr = ScrollReveal({
            origin: 'top',
            distance: '80px',
            duration: 2000,
            reset: true
        })
        sr.reveal('.project-box', { interval: 200 })
        sr.reveal('.skill-headline', { interval: 200 })
        sr.reveal('.top-header', {})
    </script>
</body>

</html>
